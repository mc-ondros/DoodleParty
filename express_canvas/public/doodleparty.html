<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="screen-orientation" content="landscape">
    <meta name="mobile-web-app-capable" content="yes">
    <title>DoodleParty - Socket Sender</title>
    <link rel="stylesheet" href="css/doodleparty.css">
</head>
<body>
    <main class="canvas-shell">
        <div id="promptOverlay" class="prompt-overlay"></div>
        <canvas id="drawingCanvas" width="1024" height="640"></canvas>
        <!-- Hidden ML canvas for data collection -->
        <canvas id="mlCanvas" width="1920" height="1080" style="display: none;"></canvas>
        
        <div class="toolbar">
            <div class="color-row" id="colorPresetRow">
                <button class="color-dot active" data-color="#3b82f6" style="--dot-color:#3b82f6"></button>
                <button class="color-dot" data-color="#f97316" style="--dot-color:#f97316"></button>
                <button class="color-dot" data-color="#facc15" style="--dot-color:#facc15"></button>
                <button class="color-dot" data-color="#22c55e" style="--dot-color:#22c55e"></button>
                <button class="color-dot" data-color="#10b981" style="--dot-color:#10b981"></button>
                <button class="color-dot" data-color="#0ea5e9" style="--dot-color:#0ea5e9"></button>
                <button class="color-dot" data-color="#14b8a6" style="--dot-color:#14b8a6"></button>
                <button class="color-dot" data-color="#8b5cf6" style="--dot-color:#8b5cf6"></button>
                <button class="color-dot" data-color="#ec4899" style="--dot-color:#ec4899"></button>
                <button class="color-dot" data-color="#f43f5e" style="--dot-color:#f43f5e"></button>
                <button class="color-dot" data-color="#111827" style="--dot-color:#111827"></button>
            </div>

            <label class="icon-control">
                <span>📏</span>
                <input type="range" id="brushSize" min="1" max="60" value="8">
            </label>
            
            <div class="socket-status-badge">
                <span class="status-dot" id="statusDot"></span>
                <span id="socketStatus">connecting…</span>
            </div>
            
            <div class="ink-meter">
                <div class="ink-fill" id="inkFill"></div>
            </div>
            
            <div class="hud-circle timer-circle" id="timerCircle"><span id="timerCircleText">00:00</span></div>
            <div class="hud-circle ink-circle" id="inkCircle"><span id="inkCircleText">100%</span></div>
            
            <div class="control-buttons">
                <button class="pill-btn" id="sendStrokeBtn" title="Send Last Stroke">
                    <span>📤</span> Last
                </button>
                <button class="pill-btn" id="sendBatchBtn" title="Send All Strokes">
                    <span>📦</span> Batch
                </button>
                <button class="pill-btn" id="clearBtn" title="Clear Canvas">
                    <span>🗑️</span> Clear
                </button>
                <button class="pill-btn" id="downloadMLBtn" title="Download ML Canvas">
                    <span>💾</span> ML
                </button>
                <button class="pill-btn" id="detectObjectsBtn" title="Detect Objects and Send to ML">
                    <span>🔍</span> Detect
                </button>
            </div>
        </div>
    </main>
    <div id="lockOverlay" style="position:fixed;inset:0;display:none;background:rgba(0,0,0,0.55);color:#fff;font:600 2rem/1.2 Noto Sans, sans-serif;align-items:center;justify-content:center;z-index:50;">Locked</div>

    <script>
        console.log('🔥 [HTML] Inline script executing - page loaded');
        console.log('🔥 [HTML] Document ready state:', document.readyState);
        console.log('🔥 [HTML] Current URL:', window.location.href);
        console.log('🔥 [HTML] Socket.IO loaded (before script):', typeof io !== 'undefined');
    </script>
    <script src="js/socket.io.min.js" onerror="console.error('❌ [HTML] FAILED to load socket.io.min.js')" onload="console.log('✅ [HTML] socket.io.min.js loaded successfully')"></script>
    <script>
        console.log('🔥 [HTML] After socket.io script tag');
        console.log('🔥 [HTML] io available:', typeof io !== 'undefined');
        if (typeof io !== 'undefined') {
            console.log('🔥 [HTML] io function type:', typeof io);
            console.log('🔥 [HTML] io.Manager available:', typeof io.Manager);
            console.log('🔥 [HTML] Attempting to create test socket...');
            try {
                const testSocket = io('/canvas');
                console.log('✅ [HTML] Test socket created:', testSocket);
                console.log('✅ [HTML] Test socket.io available:', testSocket.io);
                console.log('✅ [HTML] Test socket namespace:', testSocket.nsp);
                testSocket.on('connect', () => {
                    console.log('✅ [HTML] Test socket CONNECTED!', testSocket.id);
                });
                testSocket.on('connect_error', (err) => {
                    console.error('❌ [HTML] Test socket connect error:', err);
                });
            } catch (e) {
                console.error('❌ [HTML] Error creating test socket:', e);
            }
        } else {
            console.error('❌ [HTML] io is still undefined after loading script!');
        }
    </script>
    <script type="module" src="js/doodleparty.js?v=14"></script>
</body>
</html>
